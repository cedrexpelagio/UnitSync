<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UnitSync - Sign in (preview)</title>
<link rel="stylesheet" href="../assets/css/core.css">
<link rel="stylesheet" href="../assets/css/pages/auth/auth.css">
</head>
<body class="ua">
  <aside class="ua-aside">
    <a class="ua-brand" href="#">Unit<span>Sync</span></a>
    <div class="ua-aside-copy"><h2>Hidden on purpose</h2><p>The hero copy is removed in the quiet layout.</p></div>
  </aside>
  <main class="ua-main">
    <section class="ua-panel">
      <header class="ua-head"><p class="ua-eyebrow">Welcome back</p><h1>Sign in</h1></header>
      <form class="ua-form" onsubmit="return false">
        <div class="ua-field"><label class="ua-label" for="u">Username</label><input id="u" class="ua-input" placeholder="jdelacruz"></div>
        <div class="ua-field"><label class="ua-label" for="p">Password</label><input id="p" type="password" class="ua-input" value="secret123"></div>
        <div class="ua-actions"><button class="ua-btn ua-btn-primary" type="submit"><span class="ua-btn-label">Sign in</span></button></div>
      </form>
      <p class="ua-foot">New here? <a href="#">Create an account</a></p>
    </section>
  </main>
</body>
</html>
